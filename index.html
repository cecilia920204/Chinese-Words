<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>注音大師 - 手機Edge強化版</title>
<style>

    .hidden { display: none !important; }
    #menu, #game, #result { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 10px; box-sizing: border-box; }
    #result { overflow-y: auto; padding-bottom: 30px; }
    h1 { text-shadow: 3px 3px #3B4CCA; color: white; margin-top: 10px; font-weight: 900; -webkit-text-stroke: 1px #3B4CCA; margin-bottom: 5px; }
    
    .unit-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: 95%; margin: 10px 0; }
    .unit-btn { padding: 12px 18px; font-size: 16px; font-weight: 900; background: white; border: 3px solid #3B4CCA; border-radius: 15px; cursor: pointer; color: #3B4CCA; -webkit-user-select: none; }
    .unit-btn.active { background: #3B4CCA; color: white; }
    .all-btn { background: #CC0000; color: white; border-color: #8B0000; width: 85%; margin: 5px; }

    .start-btn { width: 45%; padding: 18px; margin: 10px; font-size: 20px; font-weight: 900; background: #008000; color: white; border: 5px solid #fff; border-radius: 50px; box-shadow: 0 6px #004d00; cursor: pointer; -webkit-user-select: none; }
    #stats { width: 95%; background: #3B4CCA; color: #fff; border: 3px solid #FFDE00; border-radius: 15px; padding: 10px; display: flex; justify-content: space-around; font-size: 18px; font-weight: 900; z-index: 100; }
    #target { margin: 10px 0; min-height: 140px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.4); border-radius: 20px; width: 90%; }

    .zhuyin-frame { display: inline-flex; position: relative; padding: 5px 12px; line-height: 1.1; align-items: center; }
    .zhuyin-main-column { display: flex; flex-direction: column; align-items: center; font-weight: 900; }
    .tone-right { position: absolute; right: 0; top: 50%; transform: translateY(-50%); font-size: 0.65em; font-weight: normal; }
    .tone-top { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); font-size: 0.65em; font-weight: normal; }
    #target .zhuyin-main-column { font-size: 70px; color: #3B4CCA; }
    #target .tone-right, #target .tone-top { font-size: 40px; color: #CC0000; }

    #balloons { position: relative; flex-grow: 1; width: 100%; overflow: hidden; }
    .balloon { position: absolute; width: 130px; height: 165px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 4px solid rgba(255,255,255,0.9); box-shadow: inset -8px -8px rgba(0,0,0,0.15); transform: translate(-50%, -50%); }
    .balloon .zhuyin-main-column { font-size: 40px; color: white; text-shadow: 2px 2px #000; }
    .balloon .tone-right, .balloon .tone-top { font-size: 24px; color: white; text-shadow: 2px 2px #000; }
    .balloon .char-text { font-size: 60px; color: white; font-weight: 900; text-shadow: 3px 3px #000; }

    #review-section { width: 90%; background: white; border-radius: 15px; padding: 15px; margin-top: 15px; border: 4px solid #3B4CCA; }
    .review-item { display: flex; justify-content: center; align-items: center; border-bottom: 2px dashed #ccc; padding: 8px; }
    .review-char { font-size: 35px; font-weight: 900; color: #CC0000; margin-right: 15px; }
</style>
</head>

<div id="menu">
    <h1>注音大師</h1>
    <p style="color:#3B4CCA; font-weight:900; margin: 2px;">選好單元後按開始遊戲！</p>
    <div class="unit-container" id="unit-box"></div>
    <button class="unit-btn all-btn" id="selectAllBtn">全選所有生字</button>
    <div style="display:flex; width:90%; justify-content:center;">
        <button class="start-btn" id="startCharBtn">看字找注音</button>
        <button class="start-btn" style="background:#3B4CCA; box-shadow:0 6px #1D2A6B;" id="startZhuyinBtn">看注音找字</button>
    </div>
</div>

<div id="game" class="hidden">
    <div id="stats">

        <div>倒數 <span id="timer">10</span>s</div>
        <div>分數 <span id="score">0</span></div>
    </div>
    <div id="target"></div>
    <div id="balloons"></div>
</div>

<div id="result" class="hidden">

    <div id="review-section" class="hidden">

function handleInteraction() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    window.speechSynthesis.speak(new SpeechSynthesisUtterance(""));
}

function initMenu() {
    const box = document.getElementById('unit-box');
    Object.keys(rawData).forEach(key => {
        const btn = document.createElement('button');
        btn.className = `unit-btn ${selectedUnits.has(key) ? 'active' : ''}`;
        btn.innerText = key;
        const toggle = (e) => {
            e.preventDefault();
            handleInteraction();
            if (selectedUnits.has(key)) selectedUnits.delete(key);
            else selectedUnits.add(key);
            btn.classList.toggle('active');
        };
        btn.addEventListener('touchstart', toggle, {passive: false});
        btn.addEventListener('click', toggle);
        box.appendChild(btn);
    });
}

function selectAll(e) {
    if(e) e.preventDefault();
    handleInteraction();
    Object.keys(rawData).forEach(key => selectedUnits.add(key));
    document.querySelectorAll('.unit-btn').forEach(btn => btn.classList.add('active'));
}

function startGame(m, e) {
    if(e) e.preventDefault();
    handleInteraction();
    if (selectedUnits.size === 0) return alert("請先選一個單元唷！");
    mode = m; mistakes = [];
    let allWords = [];
    selectedUnits.forEach(u => allWords = allWords.concat(rawData[u].split(',')));
    allWords = [...new Set(allWords)];
    questionPool = allWords.sort(() => Math.random() - 0.5).slice(0, 10);
    document.getElementById("menu").classList.add("hidden");
    document.getElementById("game").classList.remove("hidden");
    next(); animateFloat();
}

        u.onend = () => {
            const praise = new SpeechSynthesisUtterance("你好棒唷");
            praise.lang = "zh-TW";
            window.speechSynthesis.speak(praise);
        };
    }
    window.speechSynthesis.speak(u);
}

function renderZhuyin(str) {
    let m = "", tr = "", tt = "";
    for(let c of str) { if(["ˊ","ˇ","ˋ"].includes(c)) tr = c; else if(c === "˙") tt = c; else m += c; }
    let mainHtml = ""; for(let char of m) mainHtml += `<span>${char}</span>`;
    return `<div class="zhuyin-frame">${tt ? `<div class="tone-top">${tt}</div>` : ''}<div class="zhuyin-main-column">${mainHtml}</div>${tr ? `<div class="tone-right">${tr}</div>` : ''}</div>`;
}

function next() {
    if(q >= 10 || q >= questionPool.length) return end();
    clearInterval(gameTimer);
    let currentChar = questionPool[q];
    let answer = zhuyinMap[currentChar];
    q++; canGetScore = true; timeLeft = 10;
    document.getElementById("q").innerText = q;
    document.getElementById("timer").innerText = timeLeft;
    document.getElementById("target").innerHTML = (mode === 'charToZhuyin') ? `<div style="font-size:90px; font-weight:900; color:#CC0000;">${currentChar}</div>` : renderZhuyin(answer);
    initBalloons(currentChar, answer);
    gameTimer = setInterval(() => {
        timeLeft--; document.getElementById("timer").innerText = timeLeft;
        if(timeLeft <= 0) { mistakes.push(currentChar); next(); }
    }, 1000);
}

function initBalloons(curChar, ans) {
    const box = document.getElementById("balloons");
    box.innerHTML = ""; balloonsData = [];
    let correctVal = (mode === 'charToZhuyin') ? ans : curChar;
    let opts = [{t: correctVal, isC: true}];
    let allKeys = Object.keys(zhuyinMap);
    while(opts.length < 6){
        let rKey = allKeys[Math.floor(Math.random()*allKeys.length)];
        let rVal = (mode === 'charToZhuyin') ? zhuyinMap[rKey] : rKey;
        if(!opts.find(o => o.t === rVal)) opts.push({t: rVal, isC: false});
    }
    opts.sort(() => Math.random() - 0.5);
    const gridPositions = [{x:25, y:25}, {x:50, y:25}, {x:75, y:25}, {x:25, y:70}, {x:50, y:70}, {x:75, y:70}].sort(() => Math.random() - 0.5);

    opts.forEach((opt, i) => {
        const b = document.createElement("div");
        b.className = "balloon";
        b.style.background = `hsl(${i * 60}, 80%, 60%)`;
        b.innerHTML = (mode === 'charToZhuyin') ? renderZhuyin(opt.t) : `<span class="char-text">${opt.t}</span>`;
        box.appendChild(b);
        const data = { el: b, baseX: gridPositions[i].x, baseY: gridPositions[i].y, offset: Math.random() * 5, isC: opt.isC, text: opt.t };
        b.style.left = data.baseX + "%"; b.style.top = data.baseY + "%";
        
        const clickHandler = (e) => {
            e.preventDefault();
            handleInteraction();
            if(opt.isC) {
                speakReading(data.text, true);
                if(audioCtx) {
                    let o = audioCtx.createOscillator(); let g = audioCtx.createGain(); o.type='sine'; o.frequency.setValueAtTime(523, audioCtx.currentTime); o.frequency.exponentialRampToValueAtTime(1046, audioCtx.currentTime+0.2); g.gain.setValueAtTime(0.5, audioCtx.currentTime); g.gain.linearRampToValueAtTime(0, audioCtx.currentTime+0.2); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.2);
                }
                if(canGetScore) { score += 10; document.getElementById("score").innerText = score; }
                b.style.transform = "translate(-50%, -50%) scale(0)"; b.style.pointerEvents = "none";
                setTimeout(next, 800);
            } else {
                speakReading(data.text, false);
                if(audioCtx) {
                    let o = audioCtx.createOscillator(); let g = audioCtx.createGain(); o.type='triangle'; o.frequency.setValueAtTime(200, audioCtx.currentTime); o.frequency.linearRampToValueAtTime(60, audioCtx.currentTime+0.3); g.gain.setValueAtTime(0.5, audioCtx.currentTime); g.gain.linearRampToValueAtTime(0, audioCtx.currentTime+0.3); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.3);
                }
                if(canGetScore) mistakes.push(curChar);
                canGetScore = false; b.style.opacity = "0.3"; b.style.pointerEvents = "none";
            }
        };
        b.addEventListener('touchstart', clickHandler, {passive: false});
        b.addEventListener('click', clickHandler);
        balloonsData.push(data);
    });
}

function animateFloat() {
    const time = Date.now() * 0.002;
    balloonsData.forEach(b => {
        const dy = Math.sin(time + b.offset) * 2;
        b.el.style.top = (b.baseY + dy) + "%";
    });
    floatAnimReq = requestAnimationFrame(animateFloat);
}

function end() {
    clearInterval(gameTimer); cancelAnimationFrame(floatAnimReq);
    document.getElementById("game").classList.add("hidden");
    document.getElementById("result").classList.remove("hidden");
    document.getElementById("final").innerText = score;
    if(score === 100) {
        const p = pokes[Math.floor(Math.random()*pokes.length)];
        document.getElementById("pokemon-container").innerHTML = `<img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${p.id}.png" width="200"><div id="special-msg">${p.n} 挑戰成功！你真是太強了！</div>`;
        const u = new SpeechSynthesisUtterance("挑戰成功！送你強大的" + p.n); u.lang="zh-TW"; window.speechSynthesis.speak(u);
    } else {
        if(mistakes.length > 0) {
            document.getElementById("review-section").classList.remove("hidden");
            const list = document.getElementById("review-list");
            list.innerHTML = "";
            [...new Set(mistakes)].forEach(char => {
                const item = document.createElement("div");
                item.className = "review-item";
                item.innerHTML = `<div class="review-char">${char}</div><div class="review-zhuyin">${renderZhuyin(zhuyinMap[char])}</div>`;
                list.appendChild(item);
            });
        }
    }
}

initMenu();
</script>
</body>
